project:
  type: website
  output-dir: _site
  render:
    - "**/*.qmd"

website:
  title: "ICPC Math Notes"
  description: "A dependency-guided advanced mathematics course for competitive programming."
  favicon: assets/favicon.svg
  open-graph: true
  page-navigation: true
  back-to-top-navigation: true
  bread-crumbs: false
  search:
    location: sidebar
    type: overlay
    copy-button: true
  sidebar:
    style: docked
    search: true
    collapse-level: 1
    contents:
      - section: Start here
        contents:
          - index.qmd
          - 00-foundations/chapter.qmd
          - NOTATION.qmd
          - STUDY_PLAN.qmd
      - section: I · Arithmetic and counting
        contents:
          - 01-modular-algebra/chapter.qmd
          - 02-multiplicative-number-theory/chapter.qmd
          - 03-combinatorics/chapter.qmd
          - 03-combinatorics/exercises.qmd
          - 04-modular-binomials/chapter.qmd
          - 05-group-actions/chapter.qmd
          - 05-group-actions/exercises.qmd
      - section: II · Algebraic engines
        contents:
          - 06-polynomials/chapter.qmd
          - 06-polynomials/exercises.qmd
          - 07-linear-algebra/chapter.qmd
          - 08-transforms/chapter.qmd
          - 09-formal-power-series/chapter.qmd
          - 09-formal-power-series/exercises.qmd
          - 10-generating-functions/chapter.qmd
          - 10-generating-functions/exercises.qmd
          - 11-set-power-series/chapter.qmd
      - section: III · Models and synthesis
        contents:
          - 12-probability/chapter.qmd
          - 13-discrete-sums/chapter.qmd
          - 14-advanced-sieves/chapter.qmd
          - 15-capstones/chapter.qmd
      - section: IV · Frontier topics
        contents:
          - 16-q-analogues/chapter.qmd
          - 17-finite-field-polynomials/chapter.qmd
          - 18-algebraic-graph-methods/chapter.qmd
          - 19-holonomic-methods/chapter.qmd
          - 20-frontier-capstones/chapter.qmd
      - section: FPS I · Foundations & Combinatorial Species
        contents:
          - chapters/ch01-ring-convolutions-newton-inv.qmd
          - chapters/ch02-calculus-frobenius-sparse-ode-newton.qmd
          - chapters/ch03-mset-partitions-euler-polya.qmd
          - chapters/ch04-egf-set-cyc-boxed-prufer.qmd
          - checkpoints/cp01-part1-foundations.qmd
      - section: FPS II · Rational Series, Transforms & IE
        contents:
          - chapters/ch05-rational-bostan-mori-berlekamp-massey.qmd
          - chapters/ch06-binomial-snake-oil-taylor-shift-stirling.qmd
          - chapters/ch07-roots-of-unity-cyclotomic-czt.qmd
          - chapters/ch08-connected-component-ie-rook-goulden-jackson.qmd
          - checkpoints/cp02-part2-rational-transforms-ie.qmd
      - section: FPS III · Online Convolutions, Implicit LIF & Graphs
        contents:
          - chapters/ch09-cdq-fft-online-relaxed-convolution.qmd
          - chapters/ch10-implicit-equations-newton-unlabeled-trees-otter.qmd
          - chapters/ch11-laurent-residues-raney-lagrange-inversion.qmd
          - chapters/ch12-cacti-deserts-block-cut-biconnected-graphs.qmd
          - chapters/ch13-graphical-gf-eulerian-bipartite-dags-sccs.qmd
          - checkpoints/cp03-part3-online-implicit-lif-graphs.qmd
      - section: FPS IV · Stochastic PGFs, Walks & Multivariate Diagonals
        contents:
          - chapters/ch14-pgf-stopping-times-renewal-poisson-martingales.qmd
          - chapters/ch15-1d-lattice-walks-chebyshev-kernel-method.qmd
          - chapters/ch16-bivariate-hierarchy-2d-bostan-mori-furstenberg.qmd
          - chapters/ch17-quarter-plane-obstinate-kernel-good-lagrange-macmahon.qmd
          - checkpoints/cp04-part4-pgf-walks-multivariate.qmd
      - section: FPS V · D-Finite ODEs, Transposition & Fast Composition
        contents:
          - chapters/ch18-d-finite-weyl-algebra-p-recursive-indicial-lifting.qmd
          - chapters/ch19-coupled-sparse-composition-wz-truncated-taylor-ode.qmd
          - chapters/ch20-tellegen-transposition-multipoint-sampling-shift.qmd
          - chapters/ch21-kinoshita-li-composition-power-projection-revert.qmd
          - checkpoints/cp05-part5-dfinite-transposition-composition.qmd
      - section: FPS VI · Trees, q-Series & Non-Cauchy Algebras
        contents:
          - chapters/ch22-tree-dp-fps-hld-static-top-tree-zero-divisor.qmd
          - chapters/ch23-q-analogues-gaussian-binomials-q-lucas-macwilliams.qmd
          - chapters/ch24-bitwise-fwt-set-power-series-dirichlet_gf.qmd
          - checkpoints/cp06-part6-trees-qseries-sps-dirichlet.qmd
      - section: FPS Capstones & Archive
        contents:
          - capstones/synthesis-reserve.qmd
          - capstones/problem-archive-guide.qmd
      - section: Reference
        contents:
          - SOURCES.qmd
format:
  html:
    theme:
      light: [cosmo, assets/theme.scss]
      dark: [darkly, assets/theme-dark.scss]
    css: assets/styles.css
    include-after-body: assets/accessibility.html
    toc: true
    toc-depth: 3
    number-sections: false
    smooth-scroll: true
    anchor-sections: true
    link-external-newwindow: true
    code-copy: true
    code-overflow: wrap
    grid:
      sidebar-width: 270px
      body-width: 760px
      margin-width: 230px
      gutter-width: 2rem

execute:
  freeze: auto
