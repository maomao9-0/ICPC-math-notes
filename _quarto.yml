project:
  type: website
  output-dir: _site
  render:
    - "**/*.qmd"

website:
  title: "ICPC Math Notes"
  description: "Three self-contained textbooks for competitive programming: Formal Power Series & Generating Functions (Ch 01–24), Network Flows, Minimum Cuts, Matching, Duality & Modelling (Ch 01–24), and Competitive Programming Mathematics (00–20)."
  favicon: assets/favicon.svg
  open-graph: true
  page-navigation: true
  back-to-top-navigation: true
  bread-crumbs: false
  search:
    location: navbar
    type: overlay
    copy-button: true
  navbar:
    search: true
    left:
      - text: "Formal Power Series"
        href: fps/index.qmd
      - text: "Network Flows & Modelling"
        href: flows/index.qmd
      - text: "CP Mathematics"
        href: math/index.qmd
  sidebar:
    - id: fps
      title: "Formal Power Series"
      style: docked
      collapse-level: 1
      contents:
