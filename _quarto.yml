project:
  type: website
  output-dir: _site
  render:
    - "**/*.qmd"

website:
  title: "ICPC Math Notes"
  description: "A dependency-guided advanced mathematics course for competitive programming."
  favicon: assets/favicon.svg
  open-graph: true
  page-navigation: true
  back-to-top-navigation: true
  bread-crumbs: false
  search:
    location: sidebar
    type: overlay
    copy-button: true
  sidebar:
    style: docked
    search: true
    collapse-level: 1
    contents:
      - section: Start here
        contents:
          - index.qmd
          - 00-prerequisite-audit/chapter.qmd
          - NOTATION.qmd
          - STUDY_PLAN.qmd
      - section: I · Arithmetic and counting
        contents:
          - 01-modular-algebra/chapter.qmd
          - 02-multiplicative-number-theory/chapter.qmd
          - 04-combinatorics/chapter.qmd
          - 04-combinatorics/exercises.qmd
          - 14-modular-combinatorics/chapter.qmd
          - 05-group-actions/chapter.qmd
          - 05-group-actions/exercises.qmd
      - section: II · Algebraic engines
        contents:
          - 06-polynomials/chapter.qmd
          - 06-polynomials/exercises.qmd
          - 10-linear-algebra/chapter.qmd
          - 09-transforms/chapter.qmd
          - 07-formal-power-series/chapter.qmd
          - 07-formal-power-series/exercises.qmd
          - 08-generating-functions/chapter.qmd
          - 08-generating-functions/exercises.qmd
          - 16-set-power-series/chapter.qmd
      - section: III · Models and synthesis
        contents:
          - 11-probability/chapter.qmd
          - 12-discrete-sums/chapter.qmd
          - 03-advanced-sieves/chapter.qmd
          - 13-capstones/chapter.qmd
      - section: IV · Frontier topics
        contents:
          - 20-q-analogues/chapter.qmd
          - 15-finite-field-polynomials/chapter.qmd
          - 17-algebraic-graph-methods/chapter.qmd
          - 18-holonomic-methods/chapter.qmd
          - 19-frontier-capstones/chapter.qmd
      - section: Reference
        contents:
          - SOURCES.qmd
format:
  html:
    theme:
      light: [cosmo, assets/theme.scss]
      dark: [darkly, assets/theme-dark.scss]
    css: assets/styles.css
    include-after-body: assets/accessibility.html
    toc: true
    toc-depth: 3
    number-sections: false
    smooth-scroll: true
    anchor-sections: true
    link-external-newwindow: true
    code-copy: true
    code-overflow: wrap
    grid:
      sidebar-width: 270px
      body-width: 760px
      margin-width: 230px
      gutter-width: 2rem

execute:
  freeze: auto
