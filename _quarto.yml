project:
  type: website
  output-dir: _site
  render:
    - "**/*.qmd"

website:
  title: "ICPC Math Notes"
  description: "Two self-contained textbooks for competitive programming: Formal Power Series & Generating Functions (Ch 01–24) and Competitive Programming Mathematics (00–20)."
  favicon: assets/favicon.svg
  open-graph: true
  page-navigation: true
  back-to-top-navigation: true
  bread-crumbs: false
  search:
    location: navbar
    type: overlay
    copy-button: true
  navbar:
    search: true
    left:
      - text: "Formal Power Series"
        href: fps/index.qmd
      - text: "CP Mathematics"
        href: math/index.qmd
  sidebar:
    - id: fps
      title: "Formal Power Series"
      style: docked
      collapse-level: 1
      contents:
        - section: Start here
          contents:
            - fps/index.qmd
            - fps/notation.qmd
            - fps/study-plan.qmd
        - section: I · Foundations & Combinatorial Species
          contents:
            - fps/chapters/ch01-ring-convolutions-newton-inv.qmd
            - fps/chapters/ch02-calculus-frobenius-sparse-ode-newton.qmd
            - fps/chapters/ch03-mset-partitions-euler-polya.qmd
            - fps/chapters/ch04-egf-set-cyc-boxed-prufer.qmd
            - fps/checkpoints/cp01-part1-foundations.qmd
        - section: II · Rational Series, Transforms & IE
          contents:
            - fps/chapters/ch05-rational-bostan-mori-berlekamp-massey.qmd
            - fps/chapters/ch06-binomial-snake-oil-taylor-shift-stirling.qmd
            - fps/chapters/ch07-roots-of-unity-cyclotomic-czt.qmd
            - fps/chapters/ch08-connected-component-ie-rook-goulden-jackson.qmd
            - fps/checkpoints/cp02-part2-rational-transforms-ie.qmd
        - section: III · Online Convolutions, Implicit LIF & Graphs
          contents:
            - fps/chapters/ch09-cdq-fft-online-relaxed-convolution.qmd
            - fps/chapters/ch10-implicit-equations-newton-unlabeled-trees-otter.qmd
            - fps/chapters/ch11-laurent-residues-raney-lagrange-inversion.qmd
            - fps/chapters/ch12-cacti-deserts-block-cut-biconnected-graphs.qmd
            - fps/chapters/ch13-graphical-gf-eulerian-bipartite-dags-sccs.qmd
            - fps/checkpoints/cp03-part3-online-implicit-lif-graphs.qmd
        - section: IV · Stochastic PGFs, Walks & Multivariate Diagonals
          contents:
            - fps/chapters/ch14-pgf-stopping-times-renewal-poisson-martingales.qmd
            - fps/chapters/ch15-1d-lattice-walks-chebyshev-kernel-method.qmd
            - fps/chapters/ch16-bivariate-hierarchy-2d-bostan-mori-furstenberg.qmd
            - fps/chapters/ch17-quarter-plane-obstinate-kernel-good-lagrange-macmahon.qmd
            - fps/checkpoints/cp04-part4-pgf-walks-multivariate.qmd
        - section: V · D-Finite ODEs, Transposition & Fast Composition
          contents:
            - fps/chapters/ch18-d-finite-weyl-algebra-p-recursive-indicial-lifting.qmd
            - fps/chapters/ch19-coupled-sparse-composition-wz-truncated-taylor-ode.qmd
            - fps/chapters/ch20-tellegen-transposition-multipoint-sampling-shift.qmd
            - fps/chapters/ch21-kinoshita-li-composition-power-projection-revert.qmd
            - fps/checkpoints/cp05-part5-dfinite-transposition-composition.qmd
        - section: VI · Trees, q-Series & Non-Cauchy Algebras
          contents:
            - fps/chapters/ch22-tree-dp-fps-hld-static-top-tree-zero-divisor.qmd
            - fps/chapters/ch23-q-analogues-gaussian-binomials-q-lucas-macwilliams.qmd
            - fps/chapters/ch24-bitwise-fwt-set-power-series-dirichlet_gf.qmd
            - fps/checkpoints/cp06-part6-trees-qseries-sps-dirichlet.qmd
        - section: Capstones & Problem Archive
          contents:
            - fps/capstones/synthesis-reserve.qmd
            - fps/capstones/problem-archive-guide.qmd
        - section: Reference
          contents:
            - fps/sources.qmd

    - id: math
      title: "CP Mathematics"
      style: docked
      collapse-level: 1
      contents:
        - section: Start here
          contents:
            - math/index.qmd
            - math/00-foundations/chapter.qmd
            - math/notation.qmd
            - math/study-plan.qmd
        - section: I · Arithmetic and counting
          contents:
            - math/01-modular-algebra/chapter.qmd
            - math/02-multiplicative-number-theory/chapter.qmd
            - math/03-combinatorics/chapter.qmd
            - math/03-combinatorics/exercises.qmd
            - math/04-modular-binomials/chapter.qmd
            - math/05-group-actions/chapter.qmd
            - math/05-group-actions/exercises.qmd
        - section: II · Algebraic engines
          contents:
            - math/06-polynomials/chapter.qmd
            - math/06-polynomials/exercises.qmd
            - math/07-linear-algebra/chapter.qmd
            - math/08-transforms/chapter.qmd
            - math/09-formal-power-series/chapter.qmd
            - math/09-formal-power-series/exercises.qmd
            - math/10-generating-functions/chapter.qmd
            - math/10-generating-functions/exercises.qmd
            - math/11-set-power-series/chapter.qmd
        - section: III · Models and synthesis
          contents:
            - math/12-probability/chapter.qmd
            - math/13-discrete-sums/chapter.qmd
            - math/14-advanced-sieves/chapter.qmd
            - math/15-capstones/chapter.qmd
        - section: IV · Frontier topics
          contents:
            - math/16-q-analogues/chapter.qmd
            - math/17-finite-field-polynomials/chapter.qmd
            - math/18-algebraic-graph-methods/chapter.qmd
            - math/19-holonomic-methods/chapter.qmd
            - math/20-frontier-capstones/chapter.qmd
        - section: Reference
          contents:
            - math/sources.qmd

format:
  html:
    theme:
      light: [cosmo, assets/theme.scss]
      dark: [darkly, assets/theme-dark.scss]
    css: assets/styles.css
    include-after-body: assets/accessibility.html
    toc: true
    toc-depth: 3
    number-sections: false
    smooth-scroll: true
    anchor-sections: true
    link-external-newwindow: true
    code-copy: true
    code-overflow: wrap
    grid:
      sidebar-width: 270px
      body-width: 760px
      margin-width: 230px
      gutter-width: 2rem

execute:
  freeze: auto
