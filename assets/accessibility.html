<script>
// Quarto's collapsible callout headers are divs; give keyboard users the same
// activation behavior as pointer users. Bootstrap still owns collapse state.
document.addEventListener('DOMContentLoaded', () => {
  for (const header of document.querySelectorAll('.callout [data-bs-toggle="collapse"]')) {
    if (header.matches('button, a[href], input')) continue;
    header.setAttribute('role', 'button');
    header.tabIndex = 0;
    header.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        header.click();
      }
    });
  }
});

// Render Mermaid diagrams that start inside collapsed callouts once expanded.
document.addEventListener('shown.bs.collapse', async (event) => {
  if (typeof mermaid === 'undefined') return;
  for (const el of event.target.querySelectorAll('pre.mermaid-js')) {
    const text = el.textContent.replaceAll('&nbsp;', ' ');
    const id = `mermaid-lazy-${Math.random().toString(36).slice(2, 9)}`;
    const { svg: output } = await mermaid.mermaidAPI.render(id, text, el);
    el.innerHTML = output;
    const svg = el.querySelector('svg');
    const parent = el.parentElement;
    parent.removeChild(el);
    parent.appendChild(svg);
    svg.classList.add('mermaid-js');
    if (typeof _quartoMermaid !== 'undefined') {
      _quartoMermaid.postProcess(svg);
    }
  }
});
</script>
